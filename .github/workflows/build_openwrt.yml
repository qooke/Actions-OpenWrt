name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose Build Type'
        required: true
        type: choice
        options:
        - 'Multi targets'
        - 'Multi devices'
      repository:
        description: 'OpenWrt Repository'
        required: true
        type: string
        default: 'DragonBluep/openwrt'
      branch:
        description: 'OpenWrt Branch'
        required: true
        type: string
        default: 'airopi_ax3'
      templates_repository:
        description: 'Templates Repository'
        required: true
        type: string
        default: 'qooke/owrt'
      templates_branch:
        description: 'Templates Branch'
        required: true
        type: string
        default: 'tmp'
      feed_source:
        description: 'Feed Source'
        required: true
        type: choice
        options:
          - 'owrt'
          - 'imwrt'
        default: 'imwrt'
      target:
        description: 'Target'
        required: true
        type: string
        default: '["ath79/generic","ath79/nand","ipq40xx/generic","mediatek/filogic","ramips/mt7620","ramips/mt7621","ramips/mt76x8"]'
      extra_packages:
        description: 'Include Extra Packages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  determine_targets:
    name: Set targets
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.find_targets.outputs.target }}

    steps:
      - name: Set targets
        id: find_targets
        run: |
          JSON='${{ inputs.target }}'

          echo -e "\n---- targets ----\n"
          echo "$JSON"
          echo -e "\n---- targets ----\n"

          echo "target=$JSON" >> $GITHUB_OUTPUT

  build:
    name: Build OpenWrt
    needs: determine_targets
    runs-on: ubuntu-latest
    strategy:
       fail-fast: False
       matrix:
         target: ${{fromJson(needs.determine_targets.outputs.target)}}

    permissions:
      contents: read

    steps:
      - name: Checkout directory
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          fetch-depth: 0
          fetch-tags: true
          path: openwrt
          ref: ${{ inputs.branch }}          
          #token: ${{ secrets.OPENWRT_PAT }}

      - name: Checkout templates repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.templates_repository }}
          ref: ${{ inputs.templates_branch }}
          path: owrt
          fetch-depth: 1
          sparse-checkout: |
            target/templates
          token: ${{ secrets.TEMPLATES_PAT }}

      - name: Copy templates
        run: cp -a owrt/target/templates openwrt/target/ 

      - name: Initialization environment
        run: |
          TARGET=$(echo ${{ matrix.target }} | cut -d "/" -f 1)
          SUBTARGET=$(echo ${{ matrix.target }} | cut -d "/" -f 2)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "SUBTARGET=$SUBTARGET" >> "$GITHUB_ENV"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get purge -y firefox* google-chrome* microsoft-edge* \
            dotnet* libmono-* temurin-* openjdk-* powershell libllvm* \
            linux-azure* php* snapd aspnetcore-* mysql*
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Setup imwrt feeds and emortal
        if: ${{ inputs.feed_source == 'imwrt' }}
        working-directory: openwrt
        run: |
          git clone https://github.com/qooke/emortal.git package/emortal
      
          sed -i '/^src-git luci /c\src-git luci https://github.com/immortalwrt/luci.git' feeds.conf.default
          sed -i '/^src-git packages /c\src-git packages https://github.com/immortalwrt/packages.git' feeds.conf.default            

      - name: Update && Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config template
        working-directory: openwrt
        run: |
          cat ./target/templates/${{ env.TARGET }}_${{ env.SUBTARGET }}_defconfig > .config

          if [ -e ./target/templates/packages-default_defconfig ]; then
            cat ./target/templates/packages-default_defconfig >> .config
          else
            echo 'The default packages template does not exist'
          fi

      - name: Add extra packages
        if: ${{ inputs.extra_packages }}
        working-directory: openwrt
        run: |
          if [ -e ./target/templates/packages-extra_defconfig ]; then
            cat ./target/templates/packages-extra_defconfig >> .config
          else
            echo 'The extra packages template does not exist'
          fi

          # imwrt
          if [ "${{ inputs.feed_source }}" = "imwrt" ]; then
            if [ -f ./target/templates/packages-immortal_defconfig ]; then
              cat ./target/templates/packages-immortal_defconfig >> .config

              # Immortal CPU usage patch
              sed -i "s#const fd = popen('top -n1 .*#const fd = popen('/sbin/cpuusage');#g" \
                ./feeds/luci/modules/luci-base/root/usr/share/rpcd/ucode/luci

              # Immortal arm64 cpuinfo model name patch
              wget -qO \
                ./target/linux/generic/hack-6.12/312-arm64-cpuinfo-Add-model-name-in-proc-cpuinfo-for-64bit-ta.patch \
                https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/target/linux/generic/hack-6.12/312-arm64-cpuinfo-Add-model-name-in-proc-cpuinfo-for-64bit-ta.patch

            else
              echo 'The immortal packages template does not exist'
            fi
          fi       

      - name: Show configuration
        working-directory: openwrt
        run: |
          make defconfig

      - name: Prepare basic tools
        working-directory: openwrt
        run: make tools/tar/compile -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

      - name: Download packages
        working-directory: openwrt
        run: make download -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

      - name: Build tools
        working-directory: openwrt
        run: make tools/install -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

      - name: Build toolchain
        working-directory: openwrt
        run: make toolchain/install -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

      - name: Build OpenWrt
        working-directory: openwrt
        run: make -j$(nproc) BUILD_LOG=1 || ret=$? .github/workflows/scripts/show_build_failures.sh

      - name: Pack target binaries
        if: inputs.build_type == 'Multi targets'
        working-directory: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}
        run: |
          tar -cvf  ${{ env.TARGET }}_${{ env.SUBTARGET }}.tar.xz -I 'xz -9 -e --lzma2=dict=256M' --exclude=packages --exclude=*initramfs* *
          tar -cvf  ${{ env.TARGET }}_${{ env.SUBTARGET }}-initramfs.tar.xz -I 'xz -9 -e --lzma2=dict=256M' *initramfs*

      - name: Upload logs
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TARGET }}-${{ env.SUBTARGET }}-logs
          compression-level: 9
          path: "openwrt/logs"

      - name: Upload target binaries
        if: inputs.build_type == 'Multi targets'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TARGET }}_${{ env.SUBTARGET }}
          compression-level: 9
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/${{ env.TARGET }}_${{ env.SUBTARGET }}.tar.xz

      - name: Upload target initramfs binaries
        if: inputs.build_type == 'Multi targets'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TARGET }}_${{ env.SUBTARGET }}-initramfs
          compression-level: 9
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/${{ env.TARGET }}_${{ env.SUBTARGET }}-initramfs.tar.xz

      - name: Upload device binaries
        if: inputs.build_type == 'Multi devices'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.TARGET }}_${{ env.SUBTARGET }}
          compression-level: 9
          path: |
            openwrt/bin/targets/**/**/*
            !openwrt/bin/targets/**/**/packages
