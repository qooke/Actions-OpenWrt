name: Build OpenWrt MT6990

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Git Repository'
        required: true
        type: string
        default: '13179415360/openwrt-mt6990-lg6851f'
      branch:
        description: 'Git Branch'
        required: true
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  build:
    name: Build OpenWrt MT6990
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get purge -y firefox* google-chrome* microsoft-edge* \
            dotnet* libmono-* temurin-* openjdk-* powershell libllvm* \
            linux-azure* php* snapd aspnetcore-* mysql*
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl swig jq \
            xsltproc libelf-dev

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load default configuration
        run: |
          make defconfig

      - name: Prepare basic tools
        run: |
          make tools/tar/compile -j$(nproc) BUILD_LOG=1

      - name: Download package
        run: |
          make download -j$(nproc) BUILD_LOG=1

      - name: Build tools
        run: |
          make tools/install -j$(nproc) BUILD_LOG=1

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) BUILD_LOG=1

      - name: Build OpenWrt firmware
        run: |
          make -j$(nproc) BUILD_LOG=1

      - name: Check build outputs
        run: |
          ls -lah bin/targets/mediatek/mt6990/ || true
          ls -lah "A槽单刷boot和rootfs签名成功包/" || true
          ls -lah "B槽单刷boot和rootfs签名成功包/" || true

      - name: Build APK repository
        run: |
          if [ -f "./scripts/mt6990-build-apk-repository.sh" ]; then
            ./scripts/mt6990-build-apk-repository.sh
            ls -lah bin/mt6990-apk-repository
          else
            echo "APK repository script not found, skipping"
          fi

      #- name: Pack firmware target
      #  run: |
      #    if [ -d "bin/targets/mediatek/mt6990" ]; then
      #      tar -cJf mt6990-firmware-target.tar.xz bin/targets/mediatek/mt6990/
      #      ls -lh mt6990-firmware-target.tar.xz
      #    else
      #      echo "Firmware target directory not found, skipping"
      #    fi

      #- name: Pack A slot
      #  run: |
      #    if [ -d "A槽单刷boot和rootfs签名成功包" ]; then
      #      tar -cJf mt6990-lg6851f-a-slot.tar.xz "A槽单刷boot和rootfs签名成功包/"
      #      ls -lh mt6990-lg6851f-a-slot.tar.xz
      #    else
      #      echo "A slot directory not found, skipping"
      #    fi

      #- name: Pack B slot
      #  run: |
      #    if [ -d "B槽单刷boot和rootfs签名成功包" ]; then
      #      tar -cJf mt6990-lg6851f-b-slot.tar.xz "B槽单刷boot和rootfs签名成功包/"
      #      ls -lh mt6990-lg6851f-b-slot.tar.xz
      #    else
      #      echo "B slot directory not found, skipping"
      #    fi

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-mediatek-mt6990-firmware
          #compression-level: 0
          compression-level: 9
          if-no-files-found: ignore
          #path: mt6990-firmware-target.tar.xz
          path: bin/targets/mediatek/mt6990

      - name: Upload A slot binaries
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-mediatek-mt6990-lg6851f-a-slot
          #compression-level: 0
          compression-level: 9
          if-no-files-found: ignore
          #path: mt6990-lg6851f-a-slot.tar.xz
          path: A槽单刷boot和rootfs签名成功包

      - name: Upload B slot binaries
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-mediatek-mt6990-lg6851f-b-slot
          #compression-level: 0
          compression-level: 9
          if-no-files-found: ignore
          #path: mt6990-lg6851f-b-slot.tar.xz
          path: B槽单刷boot和rootfs签名成功包

      #- name: Pack APK repository
      #  run: |
      #    if [ -d "bin/mt6990-apk-repository" ]; then
      #      tar -cJf bin/mt6990-apk-repository.tar.xz bin/mt6990-apk-repository/
      #      ls -lh bin/mt6990-apk-repository.tar.xz
      #    fi

      - name: Upload APK repository
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-mediatek-mt6990-apk-repository
          #compression-level: 0
          compression-level: 9
          if-no-files-found: ignore
          #path: bin/mt6990-apk-repository.tar.xz
          path: bin/mt6990-apk-repository

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-mediatek-mt6990-lg6851f-logs
          compression-level: 9
          if-no-files-found: ignore
          path: |
            logs
            .config
            bin/targets/mediatek/mt6990/*.buildinfo
            bin/targets/mediatek/mt6990/*.manifest
